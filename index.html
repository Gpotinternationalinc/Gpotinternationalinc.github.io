<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <!-- 引入Tailwind简化样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto py-10 text-center">
        <h1 class="text-4xl font-bold text-blue-600">欢迎来到我的网页</h1>
        <p class="mt-4 text-gray-600">HTML+TailwindCSS快速搭建页面</p>
        <button id="btn" class="mt-6 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-700">点击我</button>
    </div>

    <script>
        // JS交互
        document.getElementById('btn').addEventListener('click',()=>{
            alert('按钮点击成功！');
        })
    </script>
</body>
</html>
